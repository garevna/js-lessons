name: build and deploy

# When this runs.
#   push to master  — the normal path: content or code changes, site rebuilds
#   workflow_dispatch — a manual "Run workflow" button in the Actions tab,
#                       useful when you want a rebuild without a commit
on:
  push:
    branches: [master]
  workflow_dispatch:

# By default the token a workflow gets may only read the repository. Pushing
# the built site to gh-pages is a write, so it has to be asked for explicitly.
permissions:
  contents: write

# Two pushes in quick succession would otherwise race each other to gh-pages
# and the loser could publish stale output. This lets the newer run cancel the
# older one instead.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history on purpose. The service worker version is the commit
          # count (see service-worker/config-service-worker.js), and a shallow
          # clone would report 1 — the version would go backwards on every run.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Restores the yarn cache between runs so installs take seconds
          # instead of minutes. All four lockfiles feed the cache key, so the
          # cache is invalidated when any of them changes.
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            icons-worker/yarn.lock
            content-worker/yarn.lock
            service-worker/yarn.lock

      - name: Install dependencies
        # Four independent projects: the root and the three workers.
        # --frozen-lockfile makes the install fail rather than silently
        # resolve different versions than the lockfile records.
        run: npm run install:all

      - name: Check the built lessons match content/
        # public/lessons is generated from content/, and both are committed. If
        # messages are edited and the build is not run, the two drift and
        # nothing says so — the page still renders, it is just out of date.
        # One page spent weeks showing an example heading where a paragraph
        # belonged, and it was found by eye.
        #
        # The deploy rebuilds anyway, so this does not protect the site. It
        # protects the repository, and with it anyone serving public/ locally.
        run: npm run lessons:check

      - name: Check no block pattern eats what it should not
        # Blocks are lifted out of a page before it is read line by line, so a
        # pattern that matches too much silently removes text from the middle
        # of the page and leaves what was around it cut in half. The slider
        # pattern did that to six test questions on one lesson, and the page
        # stopped rendering at the first half-question. Everything built, and
        # this workflow was green.
        run: npm run blocks

      - name: Build
        # sw-identity -> icons-worker -> content-worker -> root -> service-worker.
        # The order matters: the root bundle prints the service worker version
        # in the footer, and the version map hashes the bundles, so identity
        # comes first and the map comes last.
        #
        # This is also the only place the version is written. Locally
        # config-service-worker.js leaves it alone, so that rebuilding to
        # preview an edit does not put it in the diff; here CI is set, and the
        # deploy stamps the real number onto what it publishes.
        run: npm run full

      - name: Check the build produced everything
        # A webpack error fails the step above, but a missing entry point can
        # slip through quietly. Better to find out here than on the live site.
        #
        # The two JSON files are checked for the same reason. They are not
        # bundles — they are what the workers fetch instead of having the
        # content compiled in — and without them the site still loads, which
        # is exactly what makes their absence easy to miss.
        run: |
          for file in index.js donate.js main-menu.js content.worker.js icons.worker.js service-worker.js; do
            test -s "public/$file" || { echo "::error::public/$file is missing or empty"; exit 1; }
          done
          echo "all six bundles present"

          for file in lessons/index.json versions.json; do
            test -s "public/$file" || { echo "::error::public/$file is missing or empty"; exit 1; }
            node -e "JSON.parse(require('fs').readFileSync('public/$file','utf8'))" \
              || { echo "::error::public/$file is not valid JSON"; exit 1; }
          done
          echo "registry and version map present"

      - name: Check the workers still answer
        # Present and non-empty is not the same as working. When getMainMenu
        # became asynchronous, search went on calling it synchronously and
        # mapped over a promise: webpack was happy, every page opened, and the
        # search box silently returned nothing. This runs the built bundles
        # against public/ and asks them what the page asks.
        run: npm run workers

      - name: Publish public/ to gh-pages
        run: |
          # The site is ~290 MB, nearly all of it images and audio that rarely
          # change. Committing on top of the existing gh-pages lets git send
          # only what actually differs; starting a fresh history each time
          # would leave the server with no common ancestor to negotiate
          # against, and every deploy would upload all 290 MB again.
          # Not --depth=1: a shallow ref in an otherwise complete clone makes
          # the later push fail with "shallow update not allowed".
          if git fetch -q origin gh-pages; then
            # --no-checkout leaves the index pointing at the published site
            # without writing 290 MB to disk that rsync would overwrite a
            # moment later. git add then sees only the real differences.
            git worktree add --no-checkout -B gh-pages ../site origin/gh-pages
          else
            echo "gh-pages does not exist yet — creating it"
            git worktree add --detach ../site
            git -C ../site checkout -q --orphan gh-pages
          fi

          # --delete so files removed from public/ disappear from the site too.
          # .git is the worktree's own link file and must survive the sync.
          rsync -a --delete --exclude='.git' public/ ../site/

          # Tells GitHub Pages to serve the files as they are. Without it Pages
          # runs Jekyll, which quietly skips files and folders whose names
          # begin with an underscore.
          touch ../site/.nojekyll

          cd ../site
          git add -A

          # An identical build is not an error — a docs-only commit to master
          # can leave the output unchanged.
          if git diff --cached --quiet; then
            echo "site unchanged, nothing to publish"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Build ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q origin gh-pages

          echo "published $(git ls-files | wc -l) files"

      # Wrangler 4 wants a newer Node than the build does. This is the last
      # step, so raising the version here disturbs nothing above it.
      - name: Node for wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish the same public/ to js-lessons.pp.ua
        # The second address, and a separate site: Cloudflare Pages, not a
        # redirect. If the domain lapses or Cloudflare has a bad day,
        # garevna.github.io/js-lessons goes on serving - which is the whole
        # reason for publishing twice rather than pointing one at the other.
        #
        # No second build. Everything in public/index.html is referenced
        # relatively, so the one build works at /js-lessons/ on github.io and
        # at / on the domain. (This is what the BASE_PATH dance in the bible
        # repository is for; here there is nothing to rewrite.)
        #
        # Only changed files go up: wrangler asks Cloudflare which hashes it
        # already has. The first deploy carries ~290 MB, later ones a few.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — the domain is not deployed (see README)"
            exit 0
          fi

          # "js-lessons" is taken: a pages.dev subdomain is global, not per
          # account, and someone else's project answers at that name. This one
          # is only ever seen here and in the dashboard — readers arrive at
          # js-lessons.pp.ua — and it cannot be renamed later without deleting
          # the project, so it is spelled out rather than derived.
          PROJECT=js-lessons-course

          # The first run has no project to deploy into, and the docs do not
          # promise that deploy makes one. Create it when it is missing, and
          # say which branch is production, or every deploy lands as a preview
          # and the domain keeps serving the first upload.
          if ! npx --yes wrangler@4.132.0 pages project list | grep -q "$PROJECT"; then
            echo "creating the Pages project $PROJECT"
            npx --yes wrangler@4.132.0 pages project create "$PROJECT" --production-branch master
          fi

          npx --yes wrangler@4.132.0 pages deploy public \
            --project-name "$PROJECT" \
            --branch "$GITHUB_REF_NAME" \
            --commit-dirty=true
