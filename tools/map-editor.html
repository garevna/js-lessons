<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Редактор ментальной карты</title>
<style>
  :root {
    --bg: #0B1120;
    --panel: #111A2E;
    --line: #1E293B;
    --text: #E2E8F0;
    --dim: #94A3B8;
    --accent: #38BDF8;
    --warm: #F59E0B;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI", Roboto, system-ui, sans-serif;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0 16px 0 0; font-size: 16px; font-weight: 700; }

  button {
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #16233C;
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.save { background: #065F46; border-color: #10B981; }
  button.save:disabled { background: #16233C; border-color: var(--line); }

  .hint { color: var(--dim); font-size: 13px; }
  .state { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .where { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--warm); }
  .said { color: var(--dim); font-size: 13px; min-width: 180px; text-align: right; }

  iframe { flex: 1; width: 100%; border: 0; }
</style>
</head>
<body>

<header>
  <h1>Ментальная карта курса</h1>
  <button id="save" class="save" disabled>Сохранить (Ctrl+S)</button>
  <button id="undo" disabled>Отменить (Ctrl+Z)</button>
  <span class="hint">блок тянется мышью · Shift — только по окружности</span>
  <span class="state">
    <span class="where" id="where"></span>
    <span class="said" id="said">карта загружается…</span>
  </span>
</header>

<iframe id="map" src="/maps/course.html"></iframe>

<script>
const frame = document.getElementById('map')
const saveButton = document.getElementById('save')
const undoButton = document.getElementById('undo')
const where = document.getElementById('where')
const said = document.getElementById('said')

let map = null          // window.courseMap внутри фрейма
let comments = []       // блок "_" из course.json, его надо сохранить
let history = []        // снимки для отмены
let dirty = false
let dragged = false     // был ли сдвиг — чтобы не схлопнуть блок кликом

const say = (text, warm) => {
  said.textContent = text
  said.style.color = warm ? 'var(--warm)' : 'var(--dim)'
}

const mark = (changed) => {
  dirty = changed
  saveButton.disabled = !changed
  undoButton.disabled = !history.length
}

/** Адрес вида branch:1:3 — в узел данных и в поля, которыми он позиционирован. */
const resolve = (at) => {
  const [kind, ...rest] = at.split(':')
  const i = rest.map(Number)
  const { rings, outerOrbit } = map

  if (kind === 'ring') return { node: rings[i[0]], angle: 'headerAngle', offset: 'headerOffset', base: rings[i[0]].r, name: rings[i[0]].title }
  if (kind === 'branch') return { node: rings[i[0]].branches[i[1]], angle: 'angle', offset: 'rOffset', base: rings[i[0]].r, name: rings[i[0]].branches[i[1]].title }
  if (kind === 'item') return { node: rings[i[0]].branches[i[1]].items[i[2]], angle: 'angle', offset: 'rOffset', base: rings[i[0]].r, name: rings[i[0]].branches[i[1]].items[i[2]].title }
  if (kind === 'sat') return { node: outerOrbit.satellites[i[0]], angle: 'angle', offset: 'rOffset', base: outerOrbit.r, name: outerOrbit.satellites[i[0]].title }
  if (kind === 'satitem') return { node: outerOrbit.satellites[i[0]].items[i[1]], angle: 'angle', offset: 'rOffset', base: outerOrbit.r, name: outerOrbit.satellites[i[0]].items[i[1]].title }
  return null
}

const snapshot = () => JSON.stringify({ rings: map.rings, outerOrbit: map.outerOrbit })

const restore = (text) => {
  const data = JSON.parse(text)
  // Заменить содержимое, а не сами массивы: наружу отдан геттер.
  map.rings.forEach((ring, i) => Object.assign(ring, data.rings[i]))
  map.outerOrbit.satellites.forEach((sat, i) => Object.assign(sat, data.outerOrbit.satellites[i]))
  map.render()
}

/** Экранная точка — в координаты рисунка (там, где живут CX, CY). */
const inDrawing = (doc, event) => {
  const viewport = doc.getElementById('viewport')
  const matrix = viewport.getScreenCTM().inverse()
  const point = new DOMPoint(event.clientX, event.clientY).matrixTransform(matrix)
  return point
}

const start = () => {
  const win = frame.contentWindow
  const doc = frame.contentDocument
  map = win.courseMap

  let dragging = null

  // Перехват на погружении: иначе карта начнёт панорамироваться, а отпускание
  // кнопки свернёт ветку, по которой кликнули.
  doc.addEventListener('pointerdown', event => {
    const group = event.target.closest('[data-at]')
    if (!group) return

    const spot = resolve(group.dataset.at)
    if (!spot) return

    event.stopPropagation()
    event.preventDefault()

    dragging = { spot, at: group.dataset.at }
    dragged = false
    history.push(snapshot())
    if (history.length > 50) history.shift()
    where.textContent = spot.name
  }, true)

  doc.addEventListener('pointermove', event => {
    if (!dragging) return
    event.stopPropagation()

    const point = inDrawing(doc, event)
    const dx = point.x - map.CX
    const dy = point.y - map.CY

    // 0° — вверх, дальше по часовой: ровно как в polar().
    let angle = Math.atan2(dy, dx) * 180 / Math.PI + 90
    if (angle > 180) angle -= 360

    const { node, angle: angleField, offset: offsetField, base } = dragging.spot

    node[angleField] = Math.round(angle * 10) / 10
    if (!event.shiftKey) {
      const radius = Math.hypot(dx, dy)
      const offset = Math.round(radius - base)
      if (offset) node[offsetField] = offset
      else delete node[offsetField]
    }

    dragged = true
    mark(true)
    where.textContent = `${dragging.spot.name} — угол ${node[angleField]}°` +
      (node[offsetField] ? `, смещение ${node[offsetField]}` : ', на окружности')
    map.render()
  }, true)

  const stop = () => {
    if (!dragging) return
    dragging = null
    say('не сохранено', true)
  }
  doc.addEventListener('pointerup', stop, true)
  doc.addEventListener('pointercancel', stop, true)

  // Клик после перетаскивания свернул бы ветку — его сюда пускать не надо.
  doc.addEventListener('click', event => {
    if (!dragged) return
    dragged = false
    if (event.target.closest('[data-at]')) {
      event.stopPropagation()
      event.preventDefault()
    }
  }, true)

  doc.addEventListener('keydown', onKey)
  say('готово к правке')
}

const load = () => {
  fetch('/maps/course.json')
    .then(response => response.json())
    .then(data => { comments = data._ || [] })

  // courseMap появляется сразу, данные в нём — после своего fetch.
  const wait = setInterval(() => {
    const win = frame.contentWindow
    if (win && win.courseMap && win.courseMap.rings.length) {
      clearInterval(wait)
      start()
    }
  }, 100)
}

const store = () => {
  if (!dirty) return
  say('сохраняю…')
  fetch('/maps/course.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ _: comments, rings: map.rings, outerOrbit: map.outerOrbit }, null, 2)
  })
    .then(response => response.ok ? response.text() : response.text().then(text => Promise.reject(new Error(text))))
    .then(() => { mark(false); say('сохранено в course.json') })
    .catch(error => say('не сохранилось: ' + error.message, true))
}

const undo = () => {
  if (!history.length) return
  restore(history.pop())
  mark(true)
  where.textContent = ''
  say(history.length ? 'шаг назад' : 'вернулись к началу', true)
}

function onKey (event) {
  if (!(event.ctrlKey || event.metaKey)) return
  if (event.key === 's') { event.preventDefault(); store() }
  if (event.key === 'z') { event.preventDefault(); undo() }
}

saveButton.onclick = store
undoButton.onclick = undo
document.addEventListener('keydown', onKey)
window.addEventListener('beforeunload', event => { if (dirty) event.preventDefault() })

frame.addEventListener('load', load)
if (frame.contentDocument && frame.contentDocument.readyState === 'complete') load()
</script>

</body>
</html>
