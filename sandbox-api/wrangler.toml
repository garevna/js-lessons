name = "js-lessons-sandbox"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The Worker answers correctly without this: writes fall back to memory, which
# is per-isolate and short-lived, so a student can POST and then not find it.
# Create a namespace and uncomment to make writes shared and durable:
#
#   npx wrangler kv namespace create SANDBOX
#
# then paste the id it prints here.
#
# [[kv_namespaces]]
# binding = "SANDBOX"
# id = "paste-the-id-here"
