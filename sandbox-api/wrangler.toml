name = "js-lessons-sandbox"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Writes have to be visible on the next request: the lessons POST a user and
# read it back on the line after. KV was tried first and is the wrong primitive
# for that — measured against the deployed Worker, a POST took about a minute
# to become visible. D1 answers from its primary and is consistent at once.
#
# Recreating this elsewhere:
#
#   npx wrangler d1 create js-lessons-sandbox
#   npx wrangler d1 execute js-lessons-sandbox --remote --file=./schema.sql
#
[[d1_databases]]
binding = "DB"
database_name = "js-lessons-sandbox"
database_id = "db14a19c-c70f-4440-8854-874ae7becdad"
