<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ментальная карта курса</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0B1120;
      color: #F8FAFC;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1E293B;
      border-bottom: 1px solid #334155;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 { font-size: 16px; font-weight: 700; color: #F8FAFC; }
    header span { font-size: 12px; color: #94A3B8; font-weight: 400; margin-left: 8px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      background: #334155;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 500;
      color: #F8FAFC;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover { background: #475569; }
    button.active { background: #0284C7; border-color: #38BDF8; }
    button.active-sat { background: #D97706; border-color: #FBBF24; }
    #canvas-container {
      flex: 1;
      position: relative;
      cursor: grab;
      user-select: none;
    }
    #canvas-container:active { cursor: grabbing; }
    svg { width: 100%; height: 100%; display: block; }
    .node-group, .ring-header { cursor: pointer; }
    .node-group:hover rect, .ring-header:hover rect { filter: brightness(1.12); }

    #info-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 420px;
      max-width: calc(100vw - 40px);
      background: #1E293B;
      border: 1px solid #475569;
      color: #F8FAFC;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      z-index: 20;
      display: none;
    }
    #info-panel .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    #info-panel h3 { font-size: 15px; color: #FFFFFF; margin-bottom: 6px; padding-right: 22px; }
    #info-panel p { font-size: 13px; color: #CBD5E1; line-height: 1.5; margin-bottom: 10px; }
    .refs-box {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid #334155;
    }
    .ref-link {
      display: inline-block;
      font-family: Consolas, monospace;
      font-size: 11.5px;
      color: #38BDF8;
      background: #0F172A;
      border: 1px solid #334155;
      padding: 3px 8px;
      border-radius: 5px;
      text-decoration: none;
    }
    .ref-link:hover {
      background: #0284C7;
      color: #FFFFFF;
      border-color: #38BDF8;
    }
    #close-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      border: none;
      color: #94A3B8;
      font-size: 16px;
      padding: 2px 6px;
    }
    #close-panel:hover { color: #FFF; }

    .legend {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(6px);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      color: #CBD5E1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: none;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Ментальная карта курса JavaScript</h1>
  </div>
  <div class="controls">
    <button onclick="expandAll()">Развернуть всё</button>
    <button onclick="collapseAllRings()">Свернуть все уровни</button>
    <button id="btn-satellites" class="active-sat" onclick="toggleSatellites()">Внешний контур: ВКЛ</button>
    <button onclick="resetView()">Центрировать</button>
  </div>
</header>

<div id="canvas-container">
  <svg id="mindmap" viewBox="0 0 2400 2200">
    <defs>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3.5" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>
    <g id="viewport"></g>
  </svg>
</div>

<div class="legend">
  <div class="legend-item"><span class="dot" style="background:#EA580C"></span> Кольцо 1 (Ядро): Основы</div>
  <div class="legend-item"><span class="dot" style="background:#0D9488"></span> Кольцо 2: Прототипное наследование</div>
  <div class="legend-item"><span class="dot" style="background:#8B5CF6"></span> Кольцо 3: Функциональщина</div>
  <div class="legend-item"><span class="dot" style="background:#0284C7"></span> Кольцо 4: Асинхронщина</div>
  <div class="legend-item"><span class="dot" style="background:#F59E0B"></span> Орбита 5: Инженерия, Web APIs и Паттерны</div>
</div>

<div id="info-panel">
  <button id="close-panel" onclick="closePanel()">✕</button>
  <div id="panel-tag" class="tag">Уровень</div>
  <h3 id="panel-title">Заголовок</h3>
  <p id="panel-desc">Описание</p>
  <div id="panel-refs" class="refs-box"></div>
</div>

<script src="course.js"></script>
</body>
</html>
